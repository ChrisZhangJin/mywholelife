# Data is a bind mount owned by the image's distroless nonroot uid (65532) so
# SQLite can create/open the DB deterministically. Before first `up`, run:
#   mkdir -p data && sudo chown -R 65532:65532 data
# (A named volume's priming ownership is unreliable across hosts for a nonroot
# image and caused "unable to open database file (14)" crash loops.)
services:
  server:
    build: .
    image: mywholelife:1.0.0
    ports:
      - "8080:8080"
    environment:
      MWL_ADDR: ":8080"
      MWL_DATA_ROOT: /data
      MWL_DB_PATH: /data/mywholelife.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  # One-shot dream maintenance job (not started by default; see profiles).
  # Mirrors the host cron model in deploy/cron/mywholelife.cron — invoke with:
  #   docker compose run --rm dream --agent <agent-id>
  # Reads secrets/thresholds from deploy/cron/dream.env (operator-provided;
  # copy deploy/cron/dream.env.example, fill in, chmod 0600 — never committed).
  dream:
    image: mywholelife:1.0.0
    profiles: ["tools"]
    volumes:
      - ./data:/data
    env_file:
      - path: deploy/cron/dream.env
        required: false
    entrypoint: ["/mywholelife", "dream"]
